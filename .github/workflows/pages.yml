# Preview deployment to GitHub Pages:
# https://brandino101234.github.io/timessquareball/
#
# Builds the site for the /timessquareball/ subfolder and hides it from search
# engines. Production hosting is Vercel (see README); once the site is live
# there, this workflow can be deleted.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build for the GitHub Pages subfolder
        run: npm run build
        env:
          SITE_URL: https://brandino101234.github.io
          SITE_BASE: /timessquareball/
          NOINDEX: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
